
#################################
#         PICOM CONFIG           #
#     Animated Desktop Setup     #
#################################

# Backend
backend = "glx";
vsync = true;
se-damage = false;

# General
daemon = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;

# Shadows
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.1;
shadow-offset-x = -8;
shadow-offset-y = -8;
shadow-exclude = [
    "class_g = 'Polybar'",
    "class_g = 'Rofi'"
];

# Fading
fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 10;

# Opacity
inactive-opacity = 0.92;
active-opacity = 1.0;
frame-opacity = 0.9;
inactive-opacity-override = false;

# Rounded corners
corner-radius = 0;

# Window transparency
opacity-rule = [
    "90:class_g = 'Alacritty'",
    "90:class_g = 'kitty'",
    "92:class_g = 'Code'"
];

# Animation settings
# Requires an animation-enabled Picom fork

animations = true;

animation-stiffness = 250;
animation-dampening = 25;
animation-clamping = true;
animation-mass = 1;

animation-for-open-window = "zoom";
animation-for-unmap-window = "zoom";

animation-for-transient-window = "slide-up";
animation-for-workspace-switch-in = "slide-left";
animation-for-workspace-switch-out = "slide-right";

# Window rules
wintypes:
{
    tooltip = {
        fade = true;
        shadow = true;
        opacity = 0.95;
        focus = true;
        full-shadow = false;
    };

    dock = {
        shadow = false;
        blur-background = false;
    };

    dnd = {
        shadow = false;
    };

    popup_menu = {
        opacity = 0.95;
        fade = true;
    };

    dropdown_menu = {
        opacity = 0.95;
        fade = true;
    };
};

# Exclusions
shadow-exclude = [
    "_GTK_FRAME_EXTENTS@:c"
];

# Performance
use-damage = true;
log-level = "warn";
vsync = false;

