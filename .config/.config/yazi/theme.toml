
# ── BLAME! ───────────────────────────────────────────────────────────
# A monochrome theme for yazi. No hue anywhere: hierarchy comes from
# brightness, weight and reversal, the way the megastructure reads in ink.
#
#   void    #000000   the sky; background
#   hull    #161616   recessed surfaces (inactive tabs, progress track)
#   strata  #333333   rules and borders, the thin structural lines
#   ridge   #6b6b6b   secondary text, distant terrain
#   dust    #a3a3a3   primary text, the slope in shadow
#   plate   #d9d9d9   the lit plane: cursor, active things
#   flare   #ffffff   rare emphasis
#
# The hovered row is a lit slab with black text on it,
# a small dark figure crossing a bright surface.
# ─────────────────────────────────────────────────────────────────────

[app]
overall = { bg = "#000000" }

[mgr]
cwd             = { fg = "#d9d9d9", bold = true }
find_keyword    = { fg = "#000000", bg = "#ffffff", bold = true }
find_position   = { fg = "#6b6b6b", italic = true }
symlink_target  = { fg = "#6b6b6b", italic = true }
marker_copied   = { fg = "#d9d9d9", bg = "#d9d9d9" }
marker_cut      = { fg = "#6b6b6b", bg = "#6b6b6b" }
marker_marked   = { fg = "#a3a3a3", bg = "#a3a3a3" }
marker_selected = { fg = "#ffffff", bg = "#ffffff" }
marker_symbol   = "▐"
count_copied    = { fg = "#000000", bg = "#d9d9d9" }
count_cut       = { fg = "#d9d9d9", bg = "#333333" }
count_selected  = { fg = "#000000", bg = "#a3a3a3" }
border_symbol   = "│"
border_style    = { fg = "#333333" }

[tabs]
active    = { fg = "#000000", bg = "#d9d9d9", bold = true }
inactive  = { fg = "#6b6b6b", bg = "#161616" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#000000", bg = "#d9d9d9", bold = true }
normal_alt  = { fg = "#d9d9d9", bg = "#161616" }
select_main = { fg = "#000000", bg = "#a3a3a3", bold = true }
select_alt  = { fg = "#a3a3a3", bg = "#161616" }
unset_main  = { fg = "#d9d9d9", bg = "#333333", bold = true }
unset_alt   = { fg = "#6b6b6b", bg = "#161616" }

[indicator]
parent  = { fg = "#000000", bg = "#6b6b6b" }
current = { fg = "#000000", bg = "#d9d9d9", bold = true }
preview = { underline = true }
padding = { open = "█", close = "█" }

[status]
overall         = { fg = "#6b6b6b" }
sep_left        = { open = "", close = "" }
sep_right       = { open = "", close = "" }
perm_sep        = { fg = "#333333" }
perm_type       = { fg = "#d9d9d9" }
perm_read       = { fg = "#a3a3a3" }
perm_write      = { fg = "#d9d9d9" }
perm_exec       = { fg = "#ffffff", bold = true }
progress_label  = { fg = "#ffffff", bold = true }
progress_normal = { fg = "#a3a3a3", bg = "#161616" }
progress_error  = { fg = "#ffffff", bg = "#333333" }

[which]
cols            = 3
border          = { fg = "#333333" }
mask            = { bg = "#000000" }
cand            = { fg = "#d9d9d9", bold = true }
rest            = { fg = "#6b6b6b" }
desc            = { fg = "#a3a3a3" }
separator       = "  "
separator_style = { fg = "#333333" }

[confirm]
border     = { fg = "#6b6b6b" }
title      = { fg = "#ffffff", bold = true }
body       = { fg = "#a3a3a3" }
list       = { fg = "#a3a3a3" }
btn_yes    = { fg = "#000000", bg = "#d9d9d9", bold = true }
btn_no     = { fg = "#6b6b6b" }
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "#333333" }
title    = { fg = "#d9d9d9", bold = true }
tbl_col  = { fg = "#6b6b6b" }
tbl_cell = { fg = "#000000", bg = "#d9d9d9" }

[notify]
title_info  = { fg = "#a3a3a3" }
title_warn  = { fg = "#d9d9d9", bold = true }
title_error = { fg = "#ffffff", bold = true, underline = true }
icon_info   = "·"
icon_warn   = "!"
icon_error  = "×"

[pick]
border   = { fg = "#333333" }
active   = { fg = "#000000", bg = "#d9d9d9", bold = true }
inactive = { fg = "#a3a3a3" }

[input]
border   = { fg = "#6b6b6b" }
title    = { fg = "#d9d9d9" }
value    = { fg = "#ffffff" }
selected = { reversed = true }

[cmp]
border       = { fg = "#333333" }
active       = { fg = "#000000", bg = "#d9d9d9" }
inactive     = { fg = "#a3a3a3" }
icon_file    = "·"
icon_folder  = "▌"
icon_command = ">"

[tasks]
border  = { fg = "#333333" }
title   = { fg = "#d9d9d9" }
hovered = { fg = "#000000", bg = "#d9d9d9" }

[help]
border  = { fg = "#333333" }
chord   = { fg = "#ffffff", bold = true }
action  = { fg = "#6b6b6b" }
hovered = { fg = "#000000", bg = "#d9d9d9" }

# File colours: a brightness ladder instead of a rainbow.
# First match wins, so order matters.
[filetype]
rules = [
	# Broken links: crossed out and nearly gone
	{ url = "*", is = "orphan", fg = "#333333", crossed = true },
	{ url = "*", is = "link",   fg = "#6b6b6b", italic = true },

	# Directories: the structure itself
	{ url = "*/", fg = "#d9d9d9", bold = true },

	# Executables: the brightest thing on screen
	{ url = "*", is = "exec", fg = "#ffffff", bold = true },

	# Devices, pipes, sockets
	{ url = "*", is = "block", fg = "#a3a3a3", underline = true },
	{ url = "*", is = "char",  fg = "#a3a3a3", underline = true },
	{ url = "*", is = "fifo",  fg = "#a3a3a3", underline = true },
	{ url = "*", is = "sock",  fg = "#a3a3a3", underline = true },

	# Media and archives recede into the distance
	{ mime = "{image,video,audio}/*", fg = "#6b6b6b" },
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#6b6b6b", italic = true },

	# Everything else
	{ url = "*", fg = "#a3a3a3" },
]

# Icons: replace the nerd-font zoo with a few plain glyphs.
# Delete this whole [icon] section to get yazi's default icons back.
[icon]
globs = []
dirs  = []
files = []
exts  = []
conds = [
	{ if = "orphan", text = "×", fg = "#333333" },
	{ if = "link",   text = "↳", fg = "#6b6b6b" },
	{ if = "block",  text = "▤", fg = "#a3a3a3" },
	{ if = "char",   text = "▥", fg = "#a3a3a3" },
	{ if = "fifo",   text = "≡", fg = "#a3a3a3" },
	{ if = "sock",   text = "◎", fg = "#a3a3a3" },
	{ if = "sticky", text = "▲", fg = "#a3a3a3" },
	{ if = "dummy",  text = "?", fg = "#6b6b6b" },
	{ if = "dir",    text = "▌", fg = "#d9d9d9" },
	{ if = "exec",   text = "▸", fg = "#ffffff" },
	{ if = "!dir",   text = "·", fg = "#6b6b6b" },
]
